<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emprende con Exfoliantes</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid #2ecc71;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.2);
        }

        /* BOTÓN PRINCIPAL */
        .featured-link {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            border-radius: 15px;
            padding: 25px 20px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 1.15rem;
            display: block;
            line-height: 1.4;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .featured-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(46, 204, 113, 0.4);
            filter: brightness(1.1);
        }

        .cta-text {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://via.placeholder.com/150/2ecc71/FFFFFF?text=🌿" alt="Emprende" class="profile-img">

        <a href="https://go.hotmart.com/D103652405H" target="_blank" class="featured-link">
            Exfoliantes corporales: Aprende y emprende desde casa 🌿🫧✨
        </a>

        <p class="cta-text">Haz clic arriba para acceder a la oportunidad</p>
    </div>

</body>
</html>
