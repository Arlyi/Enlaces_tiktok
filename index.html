<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emprende con Exfoliantes | Guía</title>
    <style>
        :root {
            --primary: #55a630; /* Verde orgánico */
            --secondary: #aacc00; /* Verde lima suave */
            --bg-light: #f8f9fa;
            --text: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #f0f4f0 100%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: white;
            padding: 40px 25px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background-color: #e9f5db;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #1b4332;
            font-weight: 700;
        }

        .description {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* BOTÓN DE ACCIÓN AMIGABLE */
        .btn-main {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50px;
            padding: 22px 25px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            display: block;
            box-shadow: 0 8px 20px rgba(85, 166, 48, 0.3);
            transition: all 0.3s ease;
            animation: pulse 2s infinite; /* Efecto de latido */
        }

        .btn-main:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(85, 166, 48, 0.4);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #adb5bd;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-img">🌿</div>

        <h1>¡Comienza tu Negocio!</h1>
        <p class="description">Descubre cómo crear tus propios productos naturales y generar ingresos desde la comodidad de tu hogar.</p>

        <a href="https://go.hotmart.com/D103652405H" target="_blank" class="btn-main">
            Exfoliantes corporales: Aprende y emprende desde casa ✨🫧
        </a>

        <div class="footer">Oportunidad Exclusiva</div>
    </div>

</body>
</html>
